<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Ruleta -->
  <g transform="translate(900 315)">
    <!-- 8 segmentos -->
    <g>
      <path d="M0 0 L190 0 A190 190 0 0 1 134.4 134.4 Z" fill="#6366f1"/>
      <path d="M0 0 L134.4 134.4 A190 190 0 0 1 0 190 Z" fill="#8b5cf6"/>
      <path d="M0 0 L0 190 A190 190 0 0 1 -134.4 134.4 Z" fill="#06b6d4"/>
      <path d="M0 0 L-134.4 134.4 A190 190 0 0 1 -190 0 Z" fill="#f59e0b"/>
      <path d="M0 0 L-190 0 A190 190 0 0 1 -134.4 -134.4 Z" fill="#ec4899"/>
      <path d="M0 0 L-134.4 -134.4 A190 190 0 0 1 0 -190 Z" fill="#10b981"/>
      <path d="M0 0 L0 -190 A190 190 0 0 1 134.4 -134.4 Z" fill="#3b82f6"/>
      <path d="M0 0 L134.4 -134.4 A190 190 0 0 1 190 0 Z" fill="#f43f5e"/>
    </g>
    <circle r="190" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
    <!-- centro -->
    <circle r="52" fill="#0a0a0f" stroke="#6366f1" stroke-opacity="0.4" stroke-width="6"/>
    <path d="M-14 -20 L22 0 L-14 20 Z" fill="#6366f1"/>
    <!-- puntero -->
    <path d="M232 0 L196 -18 L196 18 Z" fill="#6366f1"/>
  </g>

  <!-- Texto -->
  <text x="80" y="240" fill="#ffffff" font-family="'Space Grotesk', Inter, sans-serif" font-size="76" font-weight="800">Ruleta de</text>
  <text x="80" y="330" fill="#818cf8" font-family="'Space Grotesk', Inter, sans-serif" font-size="76" font-weight="800">Sorteos</text>
  <text x="80" y="392" fill="#9ca3af" font-family="Inter, sans-serif" font-size="26" font-weight="500">Excel · CSV · JSON · ganadores y premios al azar</text>

  <!-- chips -->
  <g font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600">
    <rect x="80" y="440" width="130" height="44" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="100" y="469" fill="#fbbf24">🏆 1–3</text>
    <rect x="228" y="440" width="180" height="44" rx="12" fill="#8b5cf6" fill-opacity="0.15"/>
    <text x="248" y="469" fill="#a78bfa">🎁 Premios</text>
  </g>
</svg>
