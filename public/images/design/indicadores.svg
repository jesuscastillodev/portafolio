<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="80" y1="180" x2="1120" y2="180"/>
    <line x1="80" y1="320" x2="1120" y2="320"/>
    <line x1="80" y1="460" x2="1120" y2="460"/>
  </g>

  <!-- area + line -->
  <path d="M80 470 L240 400 L400 430 L560 300 L720 330 L880 200 L1040 240 L1120 160 L1120 540 L80 540 Z" fill="url(#area)"/>
  <polyline points="80,470 240,400 400,430 560,300 720,330 880,200 1040,240 1120,160" fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- points -->
  <g fill="#0a0a0f" stroke="url(#line)" stroke-width="4">
    <circle cx="560" cy="300" r="8"/>
    <circle cx="880" cy="200" r="8"/>
    <circle cx="1120" cy="160" r="8"/>
  </g>

  <!-- labels -->
  <text x="80" y="110" fill="#ffffff" font-family="'Space Grotesk', Inter, sans-serif" font-size="58" font-weight="800">Indicadores Económicos</text>
  <text x="80" y="150" fill="#9ca3af" font-family="Inter, sans-serif" font-size="26" font-weight="500">UF · Dólar · Euro · UTM · IPC — datos del Banco Central de Chile</text>

  <!-- chips -->
  <g font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600">
    <rect x="80" y="560" width="150" height="44" rx="12" fill="#6366f1" fill-opacity="0.15"/>
    <text x="100" y="589" fill="#818cf8">UF $39.179</text>
    <rect x="250" y="560" width="160" height="44" rx="12" fill="#06b6d4" fill-opacity="0.15"/>
    <text x="270" y="589" fill="#22d3ee">USD $945</text>
  </g>
</svg>
